version: 2

sources:
  - name: operational_db
    schema: "{{ env_var('POSTGRES_SCHEMA', 'public') }}"
    description: "Upstream operational database populated by the producer service."
    tables:
      - name: orders
        description: "Raw orders ingested from the application producer."
        columns:
          - name: id
            description: "Primary key identifier of the order"
          - name: customer_id
            description: "Customer ID placing order"
          - name: amount_cents
            description: "Total order value in cents"
          - name: currency
            description: "ISO currency code"
          - name: status
            description: "Lifecycle status of order"
          - name: created_at
            description: "Order creation timestamp UTC"
